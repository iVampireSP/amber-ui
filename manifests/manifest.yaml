apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amber-ui
  namespace: amber
spec:
  ingressClassName: nginx
  rules:
    - host: amber.leaflow.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: amber-ui
                port:
                  name: http-80
---
apiVersion: v1
kind: Service
metadata:
  name: amber-ui
  namespace: amber
spec:
  selector:
    app: amber-ui
  ports:
    - port: 80
      name: http-80
  type: ClusterIP
